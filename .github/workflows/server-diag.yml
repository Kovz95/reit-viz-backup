name: Server diagnostics (reit-viz prod)

# Read-only diagnostics for the Vultr box — pm2 state, memory, OOM traces,
# nginx errors. Manual dispatch only; changes nothing on the server.
# Used to chase the intermittent truncated-response / blank-page windows.

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Run diagnostics over SSH
        env:
          SSHPASS: ${{ secrets.VULTR_SSH_PASSWORD }}
          VHOST: ${{ vars.VULTR_HOST || '45.63.20.126' }}
          VUSER: ${{ vars.VULTR_USER || 'root' }}
        run: |
          if [ -z "$SSHPASS" ]; then echo "::error::VULTR_SSH_PASSWORD not set"; exit 1; fi
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
          SSHOPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
          sshpass -e ssh $SSHOPTS "$VUSER@$VHOST" 'bash -s' <<'REMOTE'
            set -uo pipefail
            echo "════ uptime / load ════"; uptime
            echo; echo "════ memory ════"; free -m
            echo; echo "════ disk ════"; df -h / | tail -1
            echo; echo "════ top RSS processes ════"; ps aux --sort=-rss | head -12
            echo; echo "════ pm2 list ════"; pm2 list
            echo; echo "════ pm2 describe reit-viz (restarts/uptime) ════"
            pm2 describe reit-viz | grep -E "status|restarts|uptime|memory|created|script" || true
            echo; echo "════ pm2 reit-viz error log (last 60) ════"
            tail -n 60 /root/.pm2/logs/reit-viz-error.log 2>/dev/null || true
            echo; echo "════ pm2 reit-viz out log (last 30) ════"
            tail -n 30 /root/.pm2/logs/reit-viz-out.log 2>/dev/null || true
            echo; echo "════ kernel OOM / kills (last 12h) ════"
            journalctl -k --since "12 hours ago" 2>/dev/null | grep -iE "oom|out of memory|killed process" | tail -20 || echo "(none)"
            echo; echo "════ nginx error log (last 40) ════"
            tail -n 40 /var/log/nginx/error.log 2>/dev/null || true
            echo; echo "════ nginx reit-viz site config ════"
            cat /etc/nginx/sites-enabled/reit-viz-https 2>/dev/null || true
            echo; echo "════ yield-corr app (:8091) — who serves it, how fresh is its data ════"
            ss -ltnp 2>/dev/null | grep ":8091" || true
            echo "── /opt/reit-yc-backend (top-level + data files by mtime) ──"
            ls -lat /opt/reit-yc-backend 2>/dev/null | head -15
            find /opt/reit-yc-backend -maxdepth 2 \( -name "*.json" -o -name "*.csv" -o -name "*.parquet" -o -name "*.db" \) -printf "%TY-%Tm-%Td %TH:%TM  %10s  %p\n" 2>/dev/null | sort -r | head -15
            echo "── update mechanism (cron/systemd timers mentioning yc/yield) ──"
            crontab -l 2>/dev/null | grep -iE "yc|yield|corr" || echo "(no matching cron entries)"
            systemctl list-timers 2>/dev/null | grep -iE "yc|yield|corr" || echo "(no matching timers)"
            echo "── scripts in the app dir ──"
            find /opt/reit-yc-backend -maxdepth 2 \( -name "*.sh" -o -name "*.py" -o -name "*.mjs" \) 2>/dev/null | head -10
            echo "── yc updater: process alive? FRED reachable? ──"
            pgrep -af "update-data" || echo "(no updater process)"
            curl -sI --max-time 10 "https://fred.stlouisfed.org/graph/fredgraph.csv?id=DGS10" | head -3 || echo "(FRED unreachable)"
            curl -s --max-time 15 "https://fred.stlouisfed.org/graph/fredgraph.csv?id=DGS2,DGS5,DGS10,DFII10,T10YIE" | head -2 || echo "(FRED CSV fetch failed)"
            echo "── yc updater first-run outcome ──"
            echo "done marker: $(cat /tmp/yc-first-run.done 2>/dev/null || echo '(absent)')"
            tail -n 8 /tmp/yc-first-run.log 2>/dev/null || echo "(no log)"
            ls -la /opt/reit-yc-backend/data.json /opt/reit-yc-backend/data.json.bak 2>/dev/null
            node -e 'const d=require("/opt/reit-yc-backend/data.json"); console.log("endDate:", d.endDate, "rows:", d.dataPoints, "lastUpdated:", d.lastUpdated)' 2>&1
            echo "── pm2 reit-yc-backend log tail ──"
            tail -n 25 /root/.pm2/logs/reit-yc-backend-error.log 2>/dev/null || true
            tail -n 15 /root/.pm2/logs/reit-yc-backend-out.log 2>/dev/null || true
            echo "── server.js routes + refresh/fetch mechanisms ──"
            grep -nE "app\.(get|post)\(|setInterval|cron|refresh|fetchData|buildData|fmpFetch|node-cron" /opt/reit-yc-backend/server.js 2>/dev/null | head -30
            echo "── all crontabs (data.json is owned by linuxuser — root's was empty) ──"
            for u in linuxuser root nick; do echo "· $u:"; crontab -l -u "$u" 2>/dev/null | grep -v "^#" | head -12 || true; done
            ls -la /etc/cron.d/ 2>/dev/null | head -10
            grep -rl "yc\|yield\|8091\|data.json" /etc/cron.d/ 2>/dev/null || echo "(nothing in /etc/cron.d)"
            echo "── data.json schema (for rebuilding the pipeline) ──"
            node -e '
              const d = require("/opt/reit-yc-backend/data.json");
              const shape = (v, depth) => {
                if (Array.isArray(v)) return `array[${v.length}]` + (v.length && depth > 0 ? ` of ${shape(v[0], depth - 1)}` : "");
                if (v && typeof v === "object") {
                  const ks = Object.keys(v);
                  if (depth <= 0) return `object{${ks.length} keys}`;
                  return "{" + ks.slice(0, 12).map((k) => `${k}: ${shape(v[k], depth - 1)}`).join(", ") + (ks.length > 12 ? ", …" : "") + "}";
                }
                return typeof v === "string" ? `"${String(v).slice(0, 24)}"` : String(v);
              };
              console.log("top:", shape(d, 1));
              for (const k of Object.keys(d)) console.log(" ", k, "→", shape(d[k], 2).slice(0, 500));
            ' 2>&1 | head -30
            echo "── server.js RAW field usage ──"
            grep -noE "RAW\.[A-Za-z_]+" /opt/reit-yc-backend/server.js | sort -t: -k2 -u | head -20
            echo "── .env keys (names only) ──"
            grep -oE "^[A-Z_]+" /opt/reit-yc-backend/.env 2>/dev/null || true
            echo "── how data.json gets built (writers) ──"
            grep -rn "data.json" /opt/reit-yc-backend/*.js /opt/reit-yc-backend/*.sh 2>/dev/null | grep -vE "read|require|loadRaw" | head -10
            find /home/linuxuser /root -maxdepth 3 \( -name "*yc*" -o -name "*yield*" \) -not -path "*/node_modules/*" 2>/dev/null | head -10

            echo; echo "════ bundle self-test from the box (10x direct :3000) ════"
            ASSET=$(ls /opt/reit-viz/dist/public/assets/index-*.js | head -1 | xargs -n1 basename)
            echo "asset: $ASSET  real size: $(stat -c%s /opt/reit-viz/dist/public/assets/$ASSET)"
            for i in $(seq 1 10); do
              SZ=$(curl -s "http://127.0.0.1:3000/assets/$ASSET" -o /dev/null -w '%{size_download}')
              SZGZ=$(curl -s --compressed "http://127.0.0.1:3000/assets/$ASSET" -o /dev/null -w '%{size_download}')
              echo "try $i: identity=$SZ gzip-raw=$SZGZ"
            done
          REMOTE
