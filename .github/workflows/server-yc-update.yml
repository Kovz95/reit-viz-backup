name: Server — yield-corr data updater (install + run)

# The yield-correlation app (/opt/reit-yc-backend, :8091) had NO data
# pipeline: data.json was a one-off upload (last Jun 12). This ships
# ops/yc/update-data.cjs (rebuilds data.json from FMP adjusted closes + FRED
# Treasury yields) via scp, runs it once, restarts the app, and installs a
# weekday cron. Scripts are committed files — no nested heredocs.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type UPDATE to install/run the yield-corr data updater'
        type: string
        required: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Guard
        if: ${{ inputs.confirm != 'UPDATE' }}
        run: |
          echo "::error::confirm must be UPDATE"; exit 1

      - name: Checkout
        uses: actions/checkout@v5

      - name: Ship scripts and run
        env:
          SSHPASS: ${{ secrets.VULTR_SSH_PASSWORD }}
          VHOST: ${{ vars.VULTR_HOST || '45.63.20.126' }}
          VUSER: ${{ vars.VULTR_USER || 'root' }}
        run: |
          if [ -z "$SSHPASS" ]; then echo "::error::VULTR_SSH_PASSWORD not set"; exit 1; fi
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
          SSHOPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
          sshpass -e scp $SSHOPTS ops/yc/update-data.cjs ops/yc/update-and-reload.sh "$VUSER@$VHOST:/opt/reit-yc-backend/"
          sshpass -e ssh $SSHOPTS "$VUSER@$VHOST" 'bash -s' <<'REMOTE'
            set -euo pipefail
            cd /opt/reit-yc-backend
            chmod +x update-and-reload.sh
            echo "════ first run (may take ~2 min: 83 FMP calls) ════"
            node update-data.cjs
            echo "════ restart app ════"
            pm2 restart reit-yc-backend
            sleep 3
            curl -s http://127.0.0.1:8091/api/health
            echo
            echo "════ install daily cron (weekdays 23:30 UTC) ════"
            (crontab -l 2>/dev/null | grep -v "update-and-reload" ; echo "30 23 * * 1-5 /opt/reit-yc-backend/update-and-reload.sh") | crontab -
            crontab -l | grep update-and-reload
          REMOTE
