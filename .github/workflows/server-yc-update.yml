name: Server — yield-corr data updater (install + run)

# The yield-correlation app (/opt/reit-yc-backend, :8091) had NO data
# pipeline: data.json was a one-off upload (last Jun 12). This ships
# ops/yc/update-data.cjs (rebuilds data.json from FMP adjusted closes + FRED
# Treasury yields) via scp, runs it once, restarts the app, and installs a
# weekday cron. Scripts are committed files — no nested heredocs.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type UPDATE to install/run the yield-corr data updater'
        type: string
        required: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Guard
        if: ${{ inputs.confirm != 'UPDATE' }}
        run: |
          echo "::error::confirm must be UPDATE"; exit 1

      - name: Checkout
        uses: actions/checkout@v5

      - name: Ship scripts and run
        env:
          SSHPASS: ${{ secrets.VULTR_SSH_PASSWORD }}
          VHOST: ${{ vars.VULTR_HOST || '45.63.20.126' }}
          VUSER: ${{ vars.VULTR_USER || 'root' }}
        run: |
          if [ -z "$SSHPASS" ]; then echo "::error::VULTR_SSH_PASSWORD not set"; exit 1; fi
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
          SSHOPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10 -o ServerAliveInterval=20 -o ServerAliveCountMax=15"
          sshpass -e scp $SSHOPTS ops/yc/update-data.cjs ops/yc/update-and-reload.sh "$VUSER@$VHOST:/opt/reit-yc-backend/"

          # Kick off the ~2-min rebuild fully detached: setsid gives it its own
          # session so sshd's SIGHUP on disconnect can't reach it (nohup alone
          # left node in the session's process group and it died with the ssh).
          sshpass -e ssh $SSHOPTS "$VUSER@$VHOST" \
            'cd /opt/reit-yc-backend && chmod +x update-and-reload.sh && rm -f /tmp/yc-first-run.done && setsid bash -c "node update-data.cjs; echo \$? > /tmp/yc-first-run.done" < /dev/null > /tmp/yc-first-run.log 2>&1 & echo kicked'

          echo "════ waiting for first run to finish ════"
          CODE=""
          for i in $(seq 1 40); do
            sleep 15
            CODE=$(sshpass -e ssh $SSHOPTS "$VUSER@$VHOST" 'cat /tmp/yc-first-run.done 2>/dev/null' || true)
            if [ -n "$CODE" ]; then break; fi
            echo "  …still running ($((i * 15))s)"
          done
          echo "════ first-run log ════"
          sshpass -e ssh $SSHOPTS "$VUSER@$VHOST" 'tail -n 20 /tmp/yc-first-run.log'
          if [ "$CODE" != "0" ]; then
            echo "::error::updater exited with '$CODE' — data.json left untouched"; exit 1
          fi

          sshpass -e ssh $SSHOPTS "$VUSER@$VHOST" 'bash -s' <<'REMOTE'
            set -euo pipefail
            echo "════ restart app ════"
            pm2 restart reit-yc-backend
            sleep 3
            curl -s http://127.0.0.1:8091/api/health
            echo
            echo "════ install daily cron (weekdays 23:30 UTC) ════"
            (crontab -l 2>/dev/null | grep -v "update-and-reload" ; echo "30 23 * * 1-5 /opt/reit-yc-backend/update-and-reload.sh") | crontab -
            crontab -l | grep update-and-reload
          REMOTE
